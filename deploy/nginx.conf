server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: любые маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ассеты с хэшем — кэшируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # данные не кэшируем, чтобы замена data.json подхватывалась сразу
    location /data/ {
        add_header Cache-Control "no-store";
    }
}
